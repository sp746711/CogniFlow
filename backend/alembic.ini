# A generic, single database configuration.

[alembic]
# Path to migration scripts.
script_location = %(here)s/alembic

# Template used when generating migration files.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone used for migration filenames.
# Leave empty to use the local timezone.
timezone =

# Maximum length of the generated migration slug.
truncate_slug_length = 40

# Set to true when the migration environment needs to support
# async database engines.
revision_environment = false

# Output encoding for generated migration files.
output_encoding = utf-8


# ---------------------------------------------------------------------------
# Logging configuration
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S


# ---------------------------------------------------------------------------
# Database connection
# ---------------------------------------------------------------------------

[post_write_hooks]

# The database URL is intentionally left empty here.
#
# CogniFlow's env.py will obtain the PostgreSQL database URL from
# the application's configuration/environment instead of storing
# credentials directly in this file.
#
# Do NOT put your real PostgreSQL password in this file.
sqlalchemy.url =